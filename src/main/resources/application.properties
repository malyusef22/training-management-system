spring.application.name=training-management-system
server.port=${SERVER_PORT:8085}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/training_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Training Management System
info.app.description=COOP Backend Project
info.app.version=1.0.0
app.project-name=Training Management System
app.training-company=COOP Training
springdoc.swagger-ui.path=/swagger-ui.html

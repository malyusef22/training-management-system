services:
  mysql:
    image: mysql:8.4
    container_name: training-mysql
    networks:
      - training-net
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=training_management_db
    ports:
      - 3307:3306

  training-management-app:
    build: .
    container_name: training-app
    networks:
      - training-net
    ports:
      - 8085:8085
    environment:
      - DB_URL=jdbc:mysql://training-mysql:3306/training_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_PASSWORD=123456

networks:
  training-net:
    external: true
    name: training-net

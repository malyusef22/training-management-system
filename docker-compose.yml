services:
  training-mysql:
    image: mysql:8.4
    container_name: training-mysql
    networks:
      - training-net
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=training_management_db
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10


  training-app:
    build: .
    container_name: training-app
    networks:
      - training-net
    ports:
      - 8085:8085
    environment:
      - DB_URL=jdbc:mysql://training-mysql:3306/training_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_PASSWORD=123456
    depends_on:
      training-mysql:
        condition: service_healthy

networks:
  training-net:
    name: training-net
 